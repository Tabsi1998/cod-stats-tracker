# Production stack: PostgreSQL, API, website behind Caddy (automatic HTTPS).
# Start: docker compose --env-file .env up -d --build   (from this folder)
name: codstats

# Hardening for every service: no privilege gain through setuid binaries, as few kernel capabilities as each needs,
# and the database reachable from the API only (backend is an internal network without a way out).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  pids_limit: 512

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *hardened
    networks: [backend]
    environment:
      POSTGRES_DB: codstats
      POSTGRES_USER: codstats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codstats -d codstats"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    <<: *hardened
    cap_drop: [ALL]
    # The API writes nothing to disk; .NET only needs a scratch /tmp.
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: Host=db;Database=codstats;Username=codstats;Password=${POSTGRES_PASSWORD}
      TrustForwardedHeaders: "true"
      Leaderboards__MinMatches: ${LEADERBOARD_MIN_MATCHES:-20}

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    <<: *hardened
    # Caddy only binds ports 80 and 443; certificates and state live in the caddy-data and caddy-config volumes.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    networks: [frontend]
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      # HTTPS (443) only with docker-compose.https.yml, i.e. when this server gets its own certificate.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # The Windows installer offered on the website; install.sh and update.sh fetch the latest release here.
      - ./downloads:/srv/downloads:ro

networks:
  backend:
    internal: true
  frontend:

volumes:
  db-data:
  caddy-data:
  caddy-config:
