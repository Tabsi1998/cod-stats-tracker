<!doctype html>
<!-- Source of public/og.png, the general link preview (1200 × 630). Rendered with Chromium at exactly that size
     from apps/web after npm ci, e.g.: npx playwright screenshot --viewport-size=1200,630 design/og-image.html public/og.png -->
<html lang="de">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Saira Condensed"; font-weight: 800; src: url("../node_modules/@fontsource/saira-condensed/files/saira-condensed-latin-800-normal.woff2"); }
  @font-face { font-family: "Saira Condensed"; font-weight: 700; src: url("../node_modules/@fontsource/saira-condensed/files/saira-condensed-latin-700-normal.woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 500; src: url("../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2"); }
  :root {
    --bg: oklch(0.155 0.018 252); --deep: oklch(0.125 0.016 252); --line: oklch(0.32 0.022 248);
    --bracket: oklch(0.62 0.03 240); --text: oklch(0.955 0.008 240); --muted: oklch(0.72 0.022 240);
    --win: oklch(0.84 0.14 205); --loss: oklch(0.72 0.17 45); --you: oklch(0.88 0.16 98);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 80% 70% at 75% 30%, oklch(0.21 0.03 240), transparent 70%), var(--bg);
    color: var(--text); font-family: "Barlow", sans-serif; position: relative;
  }
  /* Faint scan grid, as on the after-action report. */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 60px 60px; opacity: 0.18;
  }
  .frame { position: absolute; inset: 44px; }
  .c { position: absolute; width: 56px; height: 56px; border: 0 solid var(--bracket); }
  .tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; }
  .tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; }
  .bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; }
  .br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; }
  .content { position: absolute; left: 110px; top: 118px; right: 110px; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand svg { width: 132px; height: 132px; }
  h1 { font-family: "Saira Condensed", sans-serif; font-weight: 800; font-size: 168px; line-height: 0.9; letter-spacing: 0.04em; }
  h1 span { color: var(--you); }
  p { margin-top: 40px; font-size: 38px; font-weight: 500; color: var(--muted); max-width: 900px; line-height: 1.3; }
  .bar { position: absolute; left: 110px; bottom: 104px; display: flex; gap: 10px; }
  .bar i { display: block; width: 46px; height: 14px; }
  .w { background: var(--win); } .l { background: var(--loss); } .y { background: var(--you); }
  .note { position: absolute; right: 110px; bottom: 98px; font-family: "Saira Condensed", sans-serif; font-weight: 700;
          font-size: 26px; letter-spacing: 0.14em; color: var(--bracket); }
</style>
</head>
<body>
  <div class="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 8V2h6M22 16v6h-6" fill="none" stroke="var(--win)" stroke-width="2.5" />
        <path d="M16 2h6v6M8 22H2v-6" fill="none" stroke="var(--loss)" stroke-width="2.5" />
        <rect x="9" y="9" width="6" height="6" fill="var(--you)" />
      </svg>
      <h1>COD <span>STATS</span></h1>
    </div>
    <p>Community-erfasste Statistiken für Call of Duty: MW4&nbsp;Multiplayer und Warzone.</p>
  </div>
  <div class="bar"><i class="w"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="y"></i><i class="l"></i><i class="w"></i></div>
  <div class="note">K/D · SIEGQUOTE · RANKINGS</div>
</body>
</html>
