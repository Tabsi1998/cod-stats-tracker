# Second, independent confirmation after scripts/local_check.py. Runs the same checks on clean machines:
# Linux has Docker for the PostgreSQL tests and the full stack, Windows builds and tests the client.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  checks:
    name: Repository, .NET (with PostgreSQL), web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/local_check.py --only repository,dotnet,web
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: local-check-linux
          path: .local-testing/local-check.*
          if-no-files-found: ignore

  windows-client:
    name: Windows client (tests, self-contained EXE)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: dotnet test tests/desktop/CodStats.Desktop.Tests --configuration Release
      - run: python scripts/local_check.py --only desktop

  stack:
    name: Server scripts and Docker stack end to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Shellcheck
        run: shellcheck -x -S warning install.sh update.sh backup.sh restore.sh start.sh stop.sh scripts/server-common.sh
      - name: install.sh refuses a port that is already taken
        run: |
          python3 -m http.server 8095 >/dev/null 2>&1 &
          sleep 1
          if ./install.sh --behind-proxy --port 8095; then echo "installed on a taken port"; exit 1; fi
          test ! -f deploy/.env
          kill %1
      - name: install.sh behind a reverse proxy (Fabian's setup), as on a fresh server
        run: ./install.sh --behind-proxy --port 8080
      - name: End-to-end checks
        run: dotnet run --project tests/e2e/CodStats.E2E -- http://localhost:8080
      - name: Real client addresses reach the rate limit through the proxy
        run: |
          # Registration allows 10 per hour and address. Address A uses them up, B must still get through.
          register() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "X-Forwarded-For: $1" -d '{}' http://localhost:8080/api/v1/devices/register; }
          for i in $(seq 1 10); do code=$(register 203.0.113.10); test "$code" != 429 || { echo "A limited too early ($i)"; exit 1; }; done
          test "$(register 203.0.113.10)" = 429 || { echo "A was not limited after 10"; exit 1; }
          test "$(register 203.0.113.20)" != 429 || { echo "B shares A's limit: client address is lost"; exit 1; }
          echo "ok: separate limits per client address"
      - name: backup.sh
        run: |
          ./backup.sh
          test -s "$(ls -1t backups/*.dump | head -n 1)"
      - name: update.sh (rebuild and restart, with backup first)
        run: |
          ./update.sh --skip-pull
          test "$(ls -1 backups/*.dump | wc -l)" -ge 2
          curl -fs http://localhost:8080/health
      - name: No HTTPS port behind a proxy
        run: "! docker ps --format '{{.Ports}}' | grep -q ':443->'"
      - name: stop.sh and start.sh
        run: |
          ./stop.sh
          ./start.sh
          curl -fs http://localhost:8080/health
      - name: install.sh refuses a second installation
        run: "! ./install.sh --local"
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose --env-file .env logs --no-color || true
      - name: Remove
        if: always()
        working-directory: deploy
        run: docker compose --env-file .env down -v || true
